[SERVICE]
    Flush        5
    Daemon       off
    Log_Level    info
    Parsers_File parsers.conf

# -------------------------------------------------------------
# Inputs: Tail log sources in the OT / Purdue model networks
# -------------------------------------------------------------

# Tail local system logs (syslog)
[INPUT]
    Name             tail
    Tag              ot.syslog
    Path             /var/log/syslog
    Parser           syslog-rfc3164
    DB               /var/log/fluent-bit-syslog.db
    Mem_Buf_Limit    50MB
    Skip_Long_Lines  On

# Tail iptables / firewall logs mapping Purdue level transitions
[INPUT]
    Name             tail
    Tag              ot.iptables
    Path             /var/log/iptables.log
    Parser           iptables-firewall
    DB               /var/log/fluent-bit-iptables.db
    Mem_Buf_Limit    50MB
    Skip_Long_Lines  On

# Tail custom OT detection sensor alerts (e.g. Modbus/S7comm validation)
[INPUT]
    Name             tail
    Tag              ot.sensor
    Path             /var/log/ot-sensor.log
    Parser           json
    DB               /var/log/fluent-bit-sensor.db
    Mem_Buf_Limit    50MB
    Skip_Long_Lines  On

# -------------------------------------------------------------
# Filters: Enrich telemetry and apply tags
# -------------------------------------------------------------

[FILTER]
    Name             record_modifier
    Match            ot.*
    Record           host ${HOSTNAME}
    Record           environment production

# -------------------------------------------------------------
# Outputs: Stream JSON logs directly to the S3 Raw Bucket
# -------------------------------------------------------------

# Stream syslog logs
[OUTPUT]
    Name                         s3
    Match                        ot.syslog
    bucket                       ot-telemetry-raw-000000000000
    region                       us-east-1
    s3_key_format                /source=syslog/date=%Y-%m-%d/syslog-$UUID.json
    compression                  gzip
    upload_timeout               1m
    upload_chunk_size            5M
    use_put_object               true
    # For local validation / LocalStack integration
    endpoint                     http://localhost:4566
    tls                          off

# Stream firewall iptables logs
[OUTPUT]
    Name                         s3
    Match                        ot.iptables
    bucket                       ot-telemetry-raw-000000000000
    region                       us-east-1
    s3_key_format                /source=iptables/date=%Y-%m-%d/iptables-$UUID.json
    compression                  gzip
    upload_timeout               1m
    upload_chunk_size            5M
    use_put_object               true
    endpoint                     http://localhost:4566
    tls                          off

# Stream custom OT sensor telemetry
[OUTPUT]
    Name                         s3
    Match                        ot.sensor
    bucket                       ot-telemetry-raw-000000000000
    region                       us-east-1
    s3_key_format                /source=ot_sensor/date=%Y-%m-%d/sensor-$UUID.json
    compression                  gzip
    upload_timeout               1m
    upload_chunk_size            5M
    use_put_object               true
    endpoint                     http://localhost:4566
    tls                          off
