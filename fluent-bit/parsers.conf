[PARSER]
    Name        syslog-rfc3164
    Format      regex
    Regex       ^(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<hostname>[a-zA-Z0-9_\-\.]+) (?<process>[a-zA-Z0-9_\-\.]+)(?:\[(?<pid>\d+)\])?: (?<message>.*)$
    Time_Key    time
    Time_Format %b %d %H:%M:%S

[PARSER]
    Name        iptables-firewall
    Format      regex
    Regex       ^(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<hostname>[a-zA-Z0-9_\-\.]+) kernel: \[(?<uptime>[^\]]+)\] (?<rule_tag>[^ ]+) IN=(?<in_interface>[^ ]*) OUT=(?<out_interface>[^ ]*) SRC=(?<src_ip>[^ ]*) DST=(?<dst_ip>[^ ]*) LEN=(?<length>\d+) TOS=(?<tos>[^ ]*) PREC=(?<prec>[^ ]*) TTL=(?<ttl>\d+) ID=(?<id>\d+) (?:PROTO=(?<protocol>[^ ]*) SPT=(?<src_port>\d+) DPT=(?<dst_port>\d+))?(?:.*)$
    Time_Key    time
    Time_Format %b %d %H:%M:%S

[PARSER]
    Name        json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%SZ
