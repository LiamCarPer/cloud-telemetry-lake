[SERVICE]
    Flush        2
    Daemon       off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name             tail
    Path             /audit/audit.log
    Parser           json
    Tag              k8s.audit
    DB               /tmp/flb-k8s.db
    Mem_Buf_Limit    20MB
    Skip_Long_Lines  On

[OUTPUT]
    Name              s3
    Match             k8s.audit
    bucket            ot-k8s-raw-000000000000
    region            us-east-1
    s3_key_format     /audit/%Y-%m-%d/audit-$UUID.json
    compression       gzip
    upload_timeout    10s
    upload_chunk_size 1M
    use_put_object    true
    endpoint          http://localhost:4566
    tls               off
