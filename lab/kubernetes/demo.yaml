apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: demo
type: Opaque
stringData:
  username: demo
  password: not-a-real-password
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: demo
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: demo
  labels:
    app: web
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: evil
  namespace: demo
spec:
  hostPID: true
  containers:
    - name: shell
      image: alpine:3.20
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: hostpath
  namespace: demo
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
  volumes:
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-escalate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: viewer
    namespace: demo
