apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # Request bodies are needed to inspect privileged pods, hostPath mounts,
  # RBAC bindings and admission webhook changes.
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
      - group: ""
        resources: ["pods", "deployments", "daemonsets", "statefulsets", "jobs", "cronjobs"]
      - group: "rbac.authorization.k8s.io"
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      - group: "admissionregistration.k8s.io"
        resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]

  # Metadata is enough for exec/attach and secret reads, and avoids capturing
  # secret contents in the audit log.
  - level: Metadata
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "secrets", "serviceaccounts/token"]

  # Keep the rest at metadata for lab visibility without bodies.
  - level: Metadata
